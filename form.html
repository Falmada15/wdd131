<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description"
        content="Product review form where users can submit ratings and feedback about products.">
    <meta name="author" content="Franco Almada">

    <link rel="stylesheet" href="styles/form.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <div class="form-group">
                <label for="product">
                    Product Name *
                </label>

                <select id="product" name="product" required>
                    <option value="" selected disabled>
                        Select a Product ...
                    </option>
                </select>
            </div>

            <div class="form-group">
                <p class="label-title">
                    Overall Rating *
                </p>

                <div class="rating">

                    <label>
                        <input type="radio" name="rating" value="1" required>
                        ☆
                    </label>

                    <label>
                        <input type="radio" name="rating" value="2" required>
                        ☆☆
                    </label>

                    <label>
                        <input type="radio" name="rating" value="3" required>
                        ☆☆☆
                    </label>

                    <label>
                        <input type="radio" name="rating" value="4" required>
                        ☆☆☆☆
                    </label>

                    <label>
                        <input type="radio" name="rating" value="5" required>
                        ☆☆☆☆☆
                    </label>

                </div>
            </div>

            <div class="form-group">
                <label for="installDate">
                    Date of Installation *
                </label>

                <input type="date" id="installDate" name="installDate" required>
            </div>

            <div class="form-group">

                <p class="label-title">
                    Useful Features
                </p>

                <label>
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label>
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label>
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label>
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </div>

            <div class="form-group">
                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="6"></textarea>
            </div>

            <div class="form-group">
                <label for="username">
                    User Name
                </label>

                <input type="text" id="username" name="username">
            </div>

            <input type="submit" value="Submit Review" class="submit-btn">

        </form>

    </main>

    <footer>
        <p>© <span id="year"></span> | Franco Almada | Argentina</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
